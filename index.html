<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLY-FPS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:#fff;font-family:system-ui,Segoe UI,sans-serif}
canvas{display:block}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#283242,#0b0e13 70%);z-index:5}
.panel{width:min(440px,90vw);padding:28px;border:1px solid #ffffff22;border-radius:18px;background:#111722ee;box-shadow:0 20px 80px #0009;text-align:center}
h1{font-size:52px;letter-spacing:8px;margin:0 0 5px}
.sub{opacity:.7;margin-bottom:24px}
button,input{box-sizing:border-box;width:100%;padding:13px 14px;border-radius:10px;border:1px solid #ffffff22;background:#1c2431;color:#fff;font-size:16px;margin-top:10px}
button{cursor:pointer;background:#2d79ff;border:0;font-weight:700}
button:hover{filter:brightness(1.12)}
.row{display:flex;gap:10px}.row>*{flex:1}
#joinCode{text-transform:uppercase}
#gameui{display:none;position:fixed;inset:0;pointer-events:none;z-index:2}
#crosshair{position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);border:1px solid #fff;border-radius:50%;box-shadow:0 0 3px #000}
#hud{position:absolute;left:18px;bottom:18px;width:260px;text-shadow:0 2px 4px #000}
.bar{height:16px;background:#0009;border:1px solid #fff4;border-radius:5px;overflow:hidden;margin-top:5px}
.fill{height:100%;width:100%;transition:width .08s}
#stamina{background:#39d98a}#health{background:#ff4d63}
#weapon{position:absolute;right:20px;bottom:20px;text-align:right;font-size:22px;font-weight:800;text-shadow:0 2px 5px #000}
#status{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#0009;padding:8px 14px;border-radius:20px}
#score{position:absolute;right:18px;top:18px;text-align:right;text-shadow:0 2px 5px #000}
#help{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);opacity:.7;font-size:13px}
#message{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;text-align:center;text-shadow:0 3px 8px #000}
#party{font-family:monospace;letter-spacing:3px;font-size:20px}
.small{font-size:12px;opacity:.6;margin-top:12px}
</style>
</head>
<body>
<div id="menu">
 <div class="panel">
  <h1>FLY</h1><div class="sub">FIRST-PERSON FLY FPS</div>
  <button id="create">CREATE PARTY</button>
  <div style="margin-top:18px;opacity:.6">or join a party</div>
  <input id="joinCode" maxlength="8" placeholder="PARTY CODE">
  <button id="join">JOIN PARTY</button>
  <div id="menuStatus" class="small">Peer-to-peer multiplayer • up to 8 players</div>
 </div>
</div>
<div id="gameui">
 <div id="crosshair"></div><div id="status">Party: <span id="party">------</span></div>
 <div id="score">K/D: <span id="kd">0 / 0</span><br>Players: <span id="players">1</span></div>
 <div id="hud">
  <div>HEALTH <span id="hpText">100</span></div><div class="bar"><div id="health" class="fill"></div></div>
  <div style="margin-top:9px">STAMINA <span id="stText">100</span></div><div class="bar"><div id="stamina" class="fill"></div></div>
 </div>
 <div id="weapon">MACHINE GUN</div>
 <div id="message"></div>
 <div id="help">WASD move • SPACE fly/glide • SHIFT boost • Mouse aim/fire • 1 machine gun • 2 sniper • ESC unlock</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';
const MAX_PLAYERS=8, TICK=50, SNAP=80;
let scene,camera,renderer,clock,localId,hostId,isHost=false,peer,conns=new Map(),players=new Map();
let my={id:'',name:'',pos:new THREE.Vector3(0,3,12),vel:new THREE.Vector3(),yaw:Math.PI,pitch:0,health:100,stamina:100,weapon:'mg',score:0,deaths:0,onGround:false,gliding:false};
let keys={},mouse={x:0,y:0,down:false},lastShot=0,lastNet=0,started=false;
const colors=[0xff6b6b,0x55d6be,0x6b8cff,0xffc857,0xc77dff,0xff8fab,0x72efdd,0xf4f1bb];

const $=id=>document.getElementById(id);
function code(){return (localId||'').replace(/[^a-z0-9]/gi,'').slice(-6).toUpperCase()}
function setMenu(s){$('menuStatus').textContent=s}
function makeId(){return Math.random().toString(36).slice(2,8)}
function msg(t,ms=1600){$('message').textContent=t;setTimeout(()=>{if($('message').textContent===t)$('message').textContent=''},ms)}

$('create').onclick=()=>startNetwork(true);
$('join').onclick=()=>{const c=$('joinCode').value.trim().toLowerCase();if(c.length<4)return setMenu('Enter a valid party code.');startNetwork(false,c)};
window.onkeydown=e=>{keys[e.code]=true;if(e.code==='Digit1'){my.weapon='mg';$('weapon').textContent='MACHINE GUN'}if(e.code==='Digit2'){my.weapon='sniper';$('weapon').textContent='SNIPER RIFLE'}};
window.onkeyup=e=>keys[e.code]=false;

function startNetwork(host,codeArg){
 isHost=host;
 if(host){
   const id='fly-'+makeId();
   peer=new Peer(id,{debug:0});
   peer.on('open',id=>{localId=id;hostId=id;beginGame()});
   peer.on('connection',c=>setupConn(c));
   peer.on('error',e=>setMenu('Network error: '+e.type));
 }else{
   peer=new Peer(undefined,{debug:0});
   peer.on('open',id=>{localId=id;hostId='fly-'+codeArg;const c=peer.connect(hostId,{reliable:true});setupConn(c);setTimeout(()=>beginGame(),500)});
   peer.on('error',e=>setMenu('Could not join that party. Check the code and try again.'));
 }
}

function setupConn(c){
 c.on('open',()=>{
   conns.set(c.peer,c);
   c.send({type:'hello',id:localId});
   if(isHost)broadcast({type:'roster',ids:[localId,...conns.keys()]});
   updatePlayersUI();
 });
 c.on('data',d=>onNet(c,d));
 c.on('close',()=>{conns.delete(c.peer);players.delete(c.peer);updatePlayersUI()});
 c.on('error',()=>{conns.delete(c.peer)});
}

function broadcast(d,except=null){for(const [id,c] of conns)if(id!==except&&c.open)c.send(d)}
function sendHost(d){if(isHost){onHostData({id:localId},d)}else{const c=conns.get(hostId);if(c&&c.open)c.send(d)}}

function onNet(c,d){
 if(d.type==='hello'){
   if(isHost){
     players.set(d.id,{id:d.id,pos:new THREE.Vector3(0,3,0),yaw:0,pitch:0,health:100,weapon:'mg',color:colors[players.size%colors.length],score:0});
     c.send({type:'welcome',host:localId});
     broadcast({type:'playerJoin',id:d.id},d.id);
   }
 }else if(d.type==='welcome'){hostId=d.host}
 else if(d.type==='roster'){d.ids.forEach(id=>{if(id!==localId)players.set(id,players.get(id)||newRemote(id))});updatePlayersUI()}
 else if(d.type==='state'&&!isHost){applySnapshot(d)}
 else if(d.type==='spawn'&&!isHost){applySpawn(d)}
 else if(d.type==='event'){if(d.kind==='hit')msg(d.text);if(d.kind==='kill')msg(d.text,2200)}
 else if(d.type==='input'&&isHost){onHostData(c,d)}
 else if(d.type==='shot'&&isHost){handleShot(c.peer,d)}
 else if(d.type==='playerJoin'&&!isHost){players.set(d.id,players.get(d.id)||newRemote(d.id));updatePlayersUI()}
}

function newRemote(id){
 const g=new THREE.Group();g.userData.id=id;
 const body=new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),new THREE.MeshStandardMaterial({color:colors[players.size%colors.length],roughness:.8}));
 const thorax=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),new THREE.MeshStandardMaterial({color:0x111111}));
 thorax.position.z=-.16;g.add(body,thorax);
 const eyeMat=new THREE.MeshBasicMaterial({color:0xffffff});
 [-.06,.06].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.045,6,4),eyeMat);e.position.set(x,-.03,.12);g.add(e)});
 scene.add(g);
 return {id,pos:new THREE.Vector3(0,3,0),yaw:0,pitch:0,health:100,weapon:'mg',mesh:g,score:0};
}

function applySnapshot(d){
 d.players.forEach(p=>{
   if(p.id===localId){my.pos.lerp(new THREE.Vector3(p.x,p.y,p.z),.25);my.health=p.health;my.stamina=p.stamina;my.score=p.score;my.deaths=p.deaths}
   else{
    let r=players.get(p.id);if(!r){r=newRemote(p.id);players.set(p.id,r)}
    r.pos.set(p.x,p.y,p.z);r.yaw=p.yaw;r.pitch=p.pitch;r.health=p.health;r.weapon=p.weapon;r.score=p.score;
   }
 });
 updatePlayersUI();
}

function applySpawn(d){my.pos.set(d.x,d.y,d.z);my.vel.set(0,0,0);my.health=100;my.stamina=100}

function onHostData(c,d){
 const p=players.get(d.id||c.id);if(!p)return;
 if(d.type==='input'){
   p.input=d;
   p.yaw=d.yaw;p.pitch=d.pitch;p.weapon=d.weapon;
 }
}
function hostPlayerFor(id){return id===localId?my:players.get(id)}

function handleShot(id,d){
 const shooter=hostPlayerFor(id);if(!shooter||shooter.health<=0)return;
 const now=performance.now(), delay=shooter.weapon==='sniper'?900:90;
 if(now-(shooter.lastShot||0)<delay)return;shooter.lastShot=now;
 const origin=new THREE.Vector3(d.ox,d.oy,d.oz), dir=new THREE.Vector3(d.dx,d.dy,d.dz).normalize();
 let best=null,bestDist=Infinity;
 for(const [pid,p] of players){
   if(pid===id||p.health<=0)continue;
   const to=p.pos.clone().sub(origin);const t=to.dot(dir);if(t<0||t>150)continue;
   const closest=origin.clone().addScaledVector(dir,t);const dist=closest.distanceTo(p.pos);
   if(dist<.65&&t<bestDist){best={p,pid};bestDist=t}
 }
 if(id===localId){
   for(const [pid,p] of players){
     if(p.health<=0)continue;
     const to=p.pos.clone().sub(origin),t=to.dot(dir);if(t<0||t>150)continue;
     const closest=origin.clone().addScaledVector(dir,t);
     if(closest.distanceTo(p.pos)<.65&&t<bestDist){best={p,pid};bestDist=t}
   }
 }
 if(best){
   const dmg=shooter.weapon==='sniper'?100:18;
   best.p.health-=dmg;
   const dead=best.p.health<=0;
   if(dead){best.p.health=0;shooter.score=(shooter.score||0)+1;best.p.deaths=(best.p.deaths||0)+1;setTimeout(()=>respawn(best.p,best.pid),900)}
   if(id===localId)msg(dead?'ELIMINATED!':'HIT -'+dmg);
   else {const c=conns.get(id);if(c&&c.open)c.send({type:'event',kind:dead?'kill':'hit',text:dead?'YOU GOT THE FLY!':'HIT -'+dmg})}
   if(dead)broadcast({type:'event',kind:'kill',text:'A fly was eliminated'});
 }
}

function respawn(p,id){
 const a=Math.random()*Math.PI*2,r=9+Math.random()*8;
 p.pos=new THREE.Vector3(Math.cos(a)*r,2.5+Math.random()*5,Math.sin(a)*r);
 p.health=100;p.stamina=100;
 if(id===localId){my.pos.copy(p.pos);my.health=100;my.stamina=100}
 broadcast({type:'spawn',id,x:p.pos.x,y:p.pos.y,z:p.pos.z});
}

function simulateHost(dt){
 // host's own movement is simulated by the normal local controller
 for(const [id,p] of players){
   if(!p.input||p.health<=0)continue;
   const i=p.input,forward=new THREE.Vector3(-Math.sin(p.yaw),0,-Math.cos(p.yaw)),right=new THREE.Vector3(Math.cos(p.yaw),0,-Math.sin(p.yaw));
   const move=new THREE.Vector3().addScaledVector(forward,i.f).addScaledVector(right,i.r);
   if(move.lengthSq()>1)move.normalize();
   const flying=i.fly&&p.stamina>0;
   const speed=flying?(i.boost?10:6):3.2;
   p.vel=p.vel||new THREE.Vector3();p.vel.x=move.x*speed;p.vel.z=move.z*speed;
   if(flying){p.vel.y=(i.up?4.2:-1.0);p.stamina=Math.max(0,p.stamina-dt*(i.boost?30:18))}
   else {p.vel.y-=14*dt;if(i.glide&&p.vel.y< -2)p.vel.y=-2.2;p.stamina=Math.min(100,p.stamina+dt*24)}
   p.pos.addScaledVector(p.vel,dt);
   clampWorld(p.pos);
 }
}

function clampWorld(v){v.x=THREE.MathUtils.clamp(v.x,-26,26);v.y=THREE.MathUtils.clamp(v.y,.7,18);v.z=THREE.MathUtils.clamp(v.z,-20,20)}

function initScene(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc5e8);scene.fog=new THREE.Fog(0x8bc5e8,25,65);
 camera=new THREE.PerspectiveCamera(80,innerWidth/innerHeight,.03,100);camera.rotation.order='YXZ';
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
 const hemi=new THREE.HemisphereLight(0xccecff,0x45351f,2);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(10,20,8);sun.castShadow=true;scene.add(sun);
 makeArena();
 clock=new THREE.Clock();window.addEventListener('resize',resize);
 renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());
 document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){my.yaw-=e.movementX*.0022;my.pitch-=e.movementY*.0022;my.pitch=THREE.MathUtils.clamp(my.pitch,-1.45,1.45)}});
 document.addEventListener('mousedown',e=>{if(e.button===0){mouse.down=true;shoot()}});
 document.addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});
}

function box(x,y,z,sx,sy,sz,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color,roughness:.75}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m;
}
function makeArena(){
 box(0,-.35,0,56,.5,44,0x5a4a3b);
 box(0,19,0,56,.5,44,0xd6dce1);
 box(0,9.5,-22,56,19,.5,0xe9dfcf);box(-28,9.5,0,.5,19,44,0xe9dfcf);box(28,9.5,0,.5,19,44,0xe9dfcf);box(0,9.5,22,56,19,.5,0xded2bd);
 // tables / platforms
 box(0,2,-2,13,1,7,0x6e4429);box(0,4,-2,11,.35,5,0x8d5a36);
 box(-17,1.5,9,8,1,5,0x70462b);box(16,1.5,-9,7,1,4,0x70462b);
 for(let i=0;i<10;i++){const x=-22+Math.random()*44,z=-16+Math.random()*32;box(x,.4,z,.7,.8,.7,0x72a04b)}
 // hanging lights
 for(let x=-15;x<=15;x+=10){const l=new THREE.PointLight(0xffe4b0,35,14);l.position.set(x,15,0);scene.add(l);box(x,18,0,.12,5,.12,0x333333)}
}

function startGame(){
 if(started)return;started=true;initScene();$('menu').style.display='none';$('gameui').style.display='block';$('party').textContent=code();my.id=localId;my.name='Fly '+code();
 if(!isHost){players.set(hostId,newRemote(hostId));}
 requestAnimationFrame(loop);msg('CLICK TO FLY',2500);
}

function localMove(dt){
 if(my.health<=0)return;
 const f=new THREE.Vector3(-Math.sin(my.yaw),0,-Math.cos(my.yaw)),r=new THREE.Vector3(Math.cos(my.yaw),0,-Math.sin(my.yaw));
 let move=new THREE.Vector3();if(keys.KeyW)move.add(f);if(keys.KeyS)move.sub(f);if(keys.KeyD)move.add(r);if(keys.KeyA)move.sub(r);if(move.lengthSq()>1)move.normalize();
 const wantsFly=keys.Space&&my.stamina>0,boost=keys.ShiftLeft||keys.ShiftRight;
 const speed=wantsFly?(boost?10:6):3.2;
 my.vel.x=move.x*speed;my.vel.z=move.z*speed;
 if(wantsFly){my.vel.y=boost?4.8:1.8;my.stamina=Math.max(0,my.stamina-dt*(boost?32:19));my.gliding=false}
 else {my.vel.y-=14*dt;my.gliding=keys.Space;if(my.gliding&&my.vel.y<-2.2)my.vel.y=-2.2;my.stamina=Math.min(100,my.stamina+dt*25)}
 my.pos.addScaledVector(my.vel,dt);clampWorld(my.pos);
 camera.position.copy(my.pos);camera.rotation.set(my.pitch,my.yaw,0);
}

function shoot(){
 if(!started||my.health<=0)return;
 const now=performance.now(),delay=my.weapon==='sniper'?900:90;if(now-lastShot<delay)return;lastShot=now;
 const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
 const d={type:'shot',ox:my.pos.x,oy:my.pos.y,oz:my.pos.z,dx:dir.x,dy:dir.y,dz:dir.z};
 if(isHost)handleShot(localId,d);else sendHost(d);
 // muzzle flash
 const flash=new THREE.Mesh(new THREE.SphereGeometry(.035,6,4),new THREE.MeshBasicMaterial({color:0xffff99}));
 flash.position.copy(my.pos).addScaledVector(dir,.6);scene.add(flash);setTimeout(()=>scene.remove(flash),35);
}

function sendInput(){
 const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),r=(keys.KeyD?1:0)-(keys.KeyA?1:0);
 const d={type:'input',id:localId,f,r,fly:keys.Space,up:keys.Space,boost:keys.ShiftLeft||keys.ShiftRight,glide:keys.Space,yaw:my.yaw,pitch:my.pitch,weapon:my.weapon};
 sendHost(d);
}

function snapshot(){
 const arr=[{id:localId,x:my.pos.x,y:my.pos.y,z:my.pos.z,yaw:my.yaw,pitch:my.pitch,health:my.health,stamina:my.stamina,weapon:my.weapon,score:my.score,deaths:my.deaths||0}];
 for(const p of players.values())arr.push({id:p.id,x:p.pos.x,y:p.pos.y,z:p.pos.z,yaw:p.yaw,pitch:p.pitch,health:p.health,stamina:p.stamina||100,weapon:p.weapon||'mg',score:p.score||0,deaths:p.deaths||0});
 broadcast({type:'state',players:arr});
}

function updatePlayersUI(){$('players').textContent=1+players.size;$('kd').textContent=(my.score||0)+' / '+(my.deaths||0)}
function renderRemotes(){
 for(const p of players.values()){
   if(!p.mesh)continue;p.mesh.position.copy(p.pos);p.mesh.rotation.y=p.yaw;
   p.mesh.visible=p.health>0;
 }
}
function loop(){
 const dt=Math.min(clock.getDelta(),.05);
 localMove(dt);
 if(isHost)simulateHost(dt);
 if(mouse.down&&my.weapon==='mg')shoot();
 if(performance.now()-lastNet>60){lastNet=performance.now();sendInput();if(isHost)snapshot()}
 renderRemotes();
 $('hpText').textContent=Math.ceil(my.health);$('health').style.width=my.health+'%';
 $('stText').textContent=Math.ceil(my.stamina);$('stamina').style.width=my.stamina+'%';
 renderer.render(scene,camera);requestAnimationFrame(loop);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
})();
</script>
</body>
</html>
